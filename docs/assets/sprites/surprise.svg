<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#0c1e33" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5ed" />
      <stop offset="100%" stop-color="#fde4d5" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#603726" />
      <stop offset="100%" stop-color="#3b1f13" />
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="100%" stop-color="#2d3748" />
    </linearGradient>
  </defs>

  <rect width="400" height="550" rx="20" fill="url(#bgGrad)"/>
  <circle cx="200" cy="220" r="160" fill="#38bdf8" opacity="0.2" />

  <!-- Back Hair -->
  <path d="M 120,200 C 110,340 130,420 160,450 C 170,450 230,450 240,450 C 270,420 290,340 280,200 Z" fill="url(#hairGrad)" />

  <!-- Body / Coat & Scarf -->
  <path d="M 100,550 L 120,440 C 140,410 170,390 200,390 C 230,390 260,410 280,440 L 300,550 Z" fill="url(#coatGrad)" />
  <path d="M 155,385 C 180,405 220,405 245,385 C 255,420 250,470 230,480 C 205,490 195,490 170,480 C 150,470 145,420 155,385 Z" fill="#0284c7" />
  <path d="M 185,410 L 175,510 L 210,510 L 215,410 Z" fill="#38bdf8" opacity="0.85"/>

  <!-- Neck -->
  <path d="M 175,340 L 175,400 C 185,408 215,408 225,400 L 225,340 Z" fill="#fde4d5" />

  <!-- Head / Face -->
  <path d="M 140,210 C 140,310 165,360 200,360 C 235,360 260,310 260,210 C 260,140 235,110 200,110 C 165,110 140,140 140,210 Z" fill="url(#skinGrad)" />

  <!-- Artist Beret popped up with surprise -->
  <ellipse cx="190" cy="110" rx="90" ry="40" fill="#2d3748" transform="rotate(-5 190 110)"/>
  <circle cx="170" cy="74" r="5" fill="#38bdf8"/>

  <!-- Front Hair -->
  <path d="M 135,190 C 145,130 170,110 200,110 C 235,110 260,135 265,190 C 255,200 245,215 240,260 C 235,210 220,175 200,180 C 185,175 165,200 160,260 C 155,215 145,200 135,190 Z" fill="url(#hairGrad)" />

  <!-- Surprise Face: High arched eyebrows -->
  <path d="M 160,200 Q 175,188 190,198" stroke="#3b1e15" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 210,198 Q 225,188 240,200" stroke="#3b1e15" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Wide round surprised eyes -->
  <circle cx="175" cy="232" r="14" fill="#1e293b" />
  <circle cx="175" cy="232" r="8" fill="#38bdf8" />
  <circle cx="171" cy="227" r="4" fill="#ffffff" />

  <circle cx="225" cy="232" r="14" fill="#1e293b" />
  <circle cx="225" cy="232" r="8" fill="#38bdf8" />
  <circle cx="221" cy="227" r="4" fill="#ffffff" />

  <!-- Nose -->
  <path d="M 200,255 L 198,262 L 202,263" stroke="#e29578" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Round open 'O' mouth -->
  <ellipse cx="200" cy="293" rx="8" ry="11" fill="#7f1d1d" stroke="#991b1b" stroke-width="2"/>
  <ellipse cx="200" cy="296" rx="5" ry="3" fill="#fca5a5" />

  <!-- Subtle blush -->
  <ellipse cx="158" cy="254" rx="10" ry="5" fill="#f87171" opacity="0.35" />
  <ellipse cx="242" cy="254" rx="10" ry="5" fill="#f87171" opacity="0.35" />

  <!-- State Badge -->
  <rect x="20" y="20" width="135" height="32" rx="16" fill="rgba(0,0,0,0.5)" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="36" cy="36" r="6" fill="#0ea5e9" />
  <text x="52" y="41" fill="#e0f2fe" font-family="sans-serif" font-size="13" font-weight="700">SURPRISE</text>
</svg>
