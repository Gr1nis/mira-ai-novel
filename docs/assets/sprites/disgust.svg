<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c3329" />
      <stop offset="100%" stop-color="#0b1712" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf4eb" />
      <stop offset="100%" stop-color="#f2ded0" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e3522" />
      <stop offset="100%" stop-color="#301f12" />
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#37473c" />
      <stop offset="100%" stop-color="#1f2922" />
    </linearGradient>
  </defs>

  <rect width="400" height="550" rx="20" fill="url(#bgGrad)"/>
  <circle cx="200" cy="220" r="160" fill="#34d399" opacity="0.14" />

  <!-- Back Hair -->
  <path d="M 120,200 C 110,340 130,420 160,450 C 170,450 230,450 240,450 C 270,420 290,340 280,200 Z" fill="url(#hairGrad)" />

  <!-- Body / Coat & Scarf -->
  <path d="M 100,550 L 120,440 C 140,410 170,390 200,390 C 230,390 260,410 280,440 L 300,550 Z" fill="url(#coatGrad)" />
  <path d="M 155,385 C 180,405 220,405 245,385 C 255,420 250,470 230,480 C 205,490 195,490 170,480 C 150,470 145,420 155,385 Z" fill="#047857" />
  <path d="M 185,410 L 175,510 L 210,510 L 215,410 Z" fill="#059669" opacity="0.8"/>

  <!-- Neck -->
  <path d="M 175,340 L 175,400 C 185,408 215,408 225,400 L 225,340 Z" fill="#f2ded0" />

  <!-- Head / Face -->
  <path d="M 140,210 C 140,310 165,360 200,360 C 235,360 260,310 260,210 C 260,140 235,110 200,110 C 165,110 140,140 140,210 Z" fill="url(#skinGrad)" />

  <!-- Artist Beret cocked sideways with disdain -->
  <ellipse cx="188" cy="116" rx="90" ry="40" fill="#243329" transform="rotate(-15 188 116)"/>
  <circle cx="165" cy="80" r="5" fill="#34d399"/>

  <!-- Front Hair -->
  <path d="M 135,190 C 145,130 170,110 200,110 C 235,110 260,135 265,190 C 255,200 245,215 240,260 C 235,210 220,175 200,180 C 185,175 165,200 160,260 C 155,215 145,200 135,190 Z" fill="url(#hairGrad)" />

  <!-- Disgust Face: One eyebrow arched high, the other scrunched down -->
  <path d="M 160,210 Q 175,195 190,205" stroke="#3b1e15" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 210,218 Q 225,224 240,220" stroke="#3b1e15" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Skeptical side-eye -->
  <ellipse cx="175" cy="235" rx="10" ry="11" fill="#1e2e24" />
  <circle cx="177" cy="232" r="3" fill="#ffffff" />
  <ellipse cx="225" cy="237" rx="9" ry="8" fill="#1e2e24" />
  <circle cx="227" cy="235" r="2.5" fill="#ffffff" />

  <!-- Wrinkled nose -->
  <path d="M 197,253 Q 200,250 203,253" stroke="#b08968" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 196,258 Q 200,255 204,258" stroke="#b08968" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 200,260 L 198,266 L 202,267" stroke="#b08968" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Asymmetrical grimacing mouth ("ew") -->
  <path d="M 188,290 C 195,283 205,294 212,284" stroke="#854d0e" stroke-width="2.8" fill="none" stroke-linecap="round"/>

  <!-- State Badge -->
  <rect x="20" y="20" width="125" height="32" rx="16" fill="rgba(0,0,0,0.5)" stroke="#34d399" stroke-width="1.5"/>
  <circle cx="36" cy="36" r="6" fill="#10b981" />
  <text x="52" y="41" fill="#d1fae5" font-family="sans-serif" font-size="13" font-weight="700">DISGUST</text>
</svg>
