<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffebe6" />
      <stop offset="100%" stop-color="#fed7cb" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3225" />
      <stop offset="100%" stop-color="#3b1e15" />
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="100%" stop-color="#2d3748" />
    </linearGradient>
  </defs>

  <!-- Background Aura -->
  <rect width="400" height="550" rx="20" fill="url(#bgGrad)"/>
  <circle cx="200" cy="220" r="150" fill="#718096" opacity="0.12" />

  <!-- Back Hair -->
  <path d="M 120,200 C 110,340 130,420 160,450 C 170,450 230,450 240,450 C 270,420 290,340 280,200 Z" fill="url(#hairGrad)" />

  <!-- Body / Coat & Scarf -->
  <path d="M 100,550 L 120,440 C 140,410 170,390 200,390 C 230,390 260,410 280,440 L 300,550 Z" fill="url(#coatGrad)" />
  <!-- Scarf (Artist Teal) -->
  <path d="M 155,385 C 180,405 220,405 245,385 C 255,420 250,470 230,480 C 205,490 195,490 170,480 C 150,470 145,420 155,385 Z" fill="#2c7a7b" />
  <path d="M 185,410 L 175,510 L 210,510 L 215,410 Z" fill="#319795" opacity="0.9"/>

  <!-- Neck -->
  <path d="M 175,340 L 175,400 C 185,408 215,408 225,400 L 225,340 Z" fill="#fcd2c2" />

  <!-- Head / Face -->
  <path d="M 140,210 C 140,310 165,360 200,360 C 235,360 260,310 260,210 C 260,140 235,110 200,110 C 165,110 140,140 140,210 Z" fill="url(#skinGrad)" />

  <!-- Artist Beret (Navy/Plum) -->
  <ellipse cx="190" cy="115" rx="90" ry="40" fill="#2d3748" transform="rotate(-10 190 115)"/>
  <circle cx="170" cy="80" r="5" fill="#e2e8f0"/>

  <!-- Front Hair & Bangs -->
  <path d="M 135,190 C 145,130 170,110 200,110 C 235,110 260,135 265,190 C 255,200 245,215 240,260 C 235,210 220,175 200,180 C 185,175 165,200 160,260 C 155,215 145,200 135,190 Z" fill="url(#hairGrad)" />

  <!-- Neutral Face Expression -->
  <!-- Eyebrows (Calm, relaxed horizontal) -->
  <path d="M 160,215 Q 175,210 190,215" stroke="#3b1e15" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 210,215 Q 225,210 240,215" stroke="#3b1e15" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Eyes (Clear, calm, looking forward) -->
  <ellipse cx="175" cy="235" rx="10" ry="12" fill="#2d3748" />
  <circle cx="172" cy="231" r="3.5" fill="#ffffff" />
  <ellipse cx="225" cy="235" rx="10" ry="12" fill="#2d3748" />
  <circle cx="222" cy="231" r="3.5" fill="#ffffff" />

  <!-- Nose (Tiny subtle shadow) -->
  <path d="M 200,255 L 198,262 L 202,263" stroke="#e29578" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Mouth (Slight relaxed neutral line) -->
  <path d="M 193,288 Q 200,289 207,288" stroke="#a05252" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Subtle artist blush -->
  <ellipse cx="160" cy="255" rx="10" ry="4" fill="#fc8181" opacity="0.3" />
  <ellipse cx="240" cy="255" rx="10" ry="4" fill="#fc8181" opacity="0.3" />

  <!-- State Badge -->
  <rect x="20" y="20" width="120" height="32" rx="16" fill="rgba(0,0,0,0.5)" stroke="#4a5568" stroke-width="1.5"/>
  <circle cx="36" cy="36" r="6" fill="#a0aec0" />
  <text x="52" y="41" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">NEUTRAL</text>
</svg>
