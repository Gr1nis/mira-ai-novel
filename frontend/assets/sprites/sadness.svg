<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8e7e1" />
      <stop offset="100%" stop-color="#edd1c7" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a2c20" />
      <stop offset="100%" stop-color="#2d170e" />
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="400" height="550" rx="20" fill="url(#bgGrad)"/>
  <circle cx="200" cy="220" r="150" fill="#38bdf8" opacity="0.1" />

  <!-- Back Hair -->
  <path d="M 120,200 C 110,340 130,420 160,450 C 170,450 230,450 240,450 C 270,420 290,340 280,200 Z" fill="url(#hairGrad)" />

  <!-- Body / Coat & Scarf -->
  <path d="M 100,550 L 120,440 C 140,410 170,390 200,390 C 230,390 260,410 280,440 L 300,550 Z" fill="url(#coatGrad)" />
  <path d="M 155,385 C 180,405 220,405 245,385 C 255,420 250,470 230,480 C 205,490 195,490 170,480 C 150,470 145,420 155,385 Z" fill="#1e3a5f" />
  <path d="M 185,410 L 175,510 L 210,510 L 215,410 Z" fill="#2563eb" opacity="0.7"/>

  <!-- Neck -->
  <path d="M 175,340 L 175,400 C 185,408 215,408 225,400 L 225,340 Z" fill="#edd1c7" />

  <!-- Head / Face -->
  <path d="M 140,210 C 140,310 165,360 200,360 C 235,360 260,310 260,210 C 260,140 235,110 200,110 C 165,110 140,140 140,210 Z" fill="url(#skinGrad)" />

  <!-- Artist Beret slightly drooping -->
  <ellipse cx="188" cy="118" rx="90" ry="40" fill="#1e293b" transform="rotate(-14 188 118)"/>
  <circle cx="166" cy="84" r="5" fill="#94a3b8"/>

  <!-- Front Hair -->
  <path d="M 135,190 C 145,130 170,110 200,110 C 235,110 260,135 265,190 C 255,200 245,215 240,260 C 235,210 220,175 200,180 C 185,175 165,200 160,260 C 155,215 145,200 135,190 Z" fill="url(#hairGrad)" />

  <!-- Sadness Face: Brows raised in center, slanted down outward -->
  <path d="M 160,222 Q 175,212 188,206" stroke="#3b1e15" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 212,206 Q 225,212 240,222" stroke="#3b1e15" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Melancholic downcast eyes -->
  <ellipse cx="175" cy="238" rx="9" ry="10" fill="#1e293b" />
  <circle cx="172" cy="236" r="2.5" fill="#ffffff" />
  <ellipse cx="225" cy="238" rx="9" ry="10" fill="#1e293b" />
  <circle cx="222" cy="236" r="2.5" fill="#ffffff" />

  <!-- Tiny sad tear droplet -->
  <path d="M 166,248 C 164,254 168,258 171,255 C 173,252 168,248 166,248 Z" fill="#67e8f9" opacity="0.85"/>

  <!-- Nose -->
  <path d="M 200,256 L 198,263 L 202,264" stroke="#d58f79" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Mouth: Corners down, gentle tremor of sadness -->
  <path d="M 193,293 Q 200,285 207,293" stroke="#994d53" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- State Badge -->
  <rect x="20" y="20" width="125" height="32" rx="16" fill="rgba(0,0,0,0.5)" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="36" cy="36" r="6" fill="#38bdf8" />
  <text x="52" y="41" fill="#e0f2fe" font-family="sans-serif" font-size="13" font-weight="700">SADNESS</text>
</svg>
