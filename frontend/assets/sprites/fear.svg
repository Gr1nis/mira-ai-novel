<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1b3d" />
      <stop offset="100%" stop-color="#120c1a" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e6eb" />
      <stop offset="100%" stop-color="#ebd2dc" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#462338" />
      <stop offset="100%" stop-color="#2c1423" />
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b2b47" />
      <stop offset="100%" stop-color="#23182b" />
    </linearGradient>
  </defs>

  <rect width="400" height="550" rx="20" fill="url(#bgGrad)"/>
  <circle cx="200" cy="220" r="160" fill="#c084fc" opacity="0.14" />

  <!-- Back Hair -->
  <path d="M 120,200 C 110,340 130,420 160,450 C 170,450 230,450 240,450 C 270,420 290,340 280,200 Z" fill="url(#hairGrad)" />

  <!-- Body / Coat & Scarf -->
  <path d="M 100,550 L 120,440 C 140,410 170,390 200,390 C 230,390 260,410 280,440 L 300,550 Z" fill="url(#coatGrad)" />
  <path d="M 155,385 C 180,405 220,405 245,385 C 255,420 250,470 230,480 C 205,490 195,490 170,480 C 150,470 145,420 155,385 Z" fill="#5b21b6" />
  <path d="M 185,410 L 175,510 L 210,510 L 215,410 Z" fill="#7c3aed" opacity="0.8"/>

  <!-- Neck -->
  <path d="M 175,340 L 175,400 C 185,408 215,408 225,400 L 225,340 Z" fill="#ebd2dc" />

  <!-- Head / Face -->
  <path d="M 140,210 C 140,310 165,360 200,360 C 235,360 260,310 260,210 C 260,140 235,110 200,110 C 165,110 140,140 140,210 Z" fill="url(#skinGrad)" />

  <!-- Artist Beret slightly pulled back nervously -->
  <ellipse cx="190" cy="115" rx="88" ry="40" fill="#2d1d36" transform="rotate(-8 190 115)"/>
  <circle cx="170" cy="80" r="5" fill="#c084fc"/>

  <!-- Front Hair -->
  <path d="M 135,190 C 145,130 170,110 200,110 C 235,110 260,135 265,190 C 255,200 245,215 240,260 C 235,210 220,175 200,180 C 185,175 165,200 160,260 C 155,215 145,200 135,190 Z" fill="url(#hairGrad)" />

  <!-- Fear Face: Brows raised high and drawn together -->
  <path d="M 160,206 Q 175,198 188,206" stroke="#3b1e15" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 212,206 Q 225,198 240,206" stroke="#3b1e15" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Wide, startled / anxious pupils -->
  <ellipse cx="175" cy="235" rx="12" ry="14" fill="#1e1026" />
  <circle cx="175" cy="235" r="5" fill="#381b47" />
  <circle cx="171" cy="230" r="3" fill="#ffffff" />
  <circle cx="178" cy="239" r="1.5" fill="#ffffff" />

  <ellipse cx="225" cy="235" rx="12" ry="14" fill="#1e1026" />
  <circle cx="225" cy="235" r="5" fill="#381b47" />
  <circle cx="221" cy="230" r="3" fill="#ffffff" />
  <circle cx="228" cy="239" r="1.5" fill="#ffffff" />

  <!-- Nervous sweat bead -->
  <path d="M 245,225 C 248,232 243,236 240,233 C 238,230 243,225 245,225 Z" fill="#67e8f9" opacity="0.9"/>

  <!-- Nose -->
  <path d="M 200,257 L 198,264 L 202,265" stroke="#be8ca0" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Anxious small open trembling mouth -->
  <ellipse cx="200" cy="292" rx="7" ry="5" fill="#581c3b" stroke="#70244c" stroke-width="1.5"/>

  <!-- State Badge -->
  <rect x="20" y="20" width="105" height="32" rx="16" fill="rgba(0,0,0,0.5)" stroke="#c084fc" stroke-width="1.5"/>
  <circle cx="36" cy="36" r="6" fill="#a855f7" />
  <text x="52" y="41" fill="#f3e8ff" font-family="sans-serif" font-size="13" font-weight="700">FEAR</text>
</svg>
