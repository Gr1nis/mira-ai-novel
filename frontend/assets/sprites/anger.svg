<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a1a" />
      <stop offset="100%" stop-color="#1a0909" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe6e1" />
      <stop offset="100%" stop-color="#f8c7be" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55201a" />
      <stop offset="100%" stop-color="#35100c" />
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3b3b" />
      <stop offset="100%" stop-color="#241a1a" />
    </linearGradient>
  </defs>

  <rect width="400" height="550" rx="20" fill="url(#bgGrad)"/>
  <circle cx="200" cy="220" r="160" fill="#f87171" opacity="0.16" />

  <!-- Back Hair -->
  <path d="M 120,200 C 110,340 130,420 160,450 C 170,450 230,450 240,450 C 270,420 290,340 280,200 Z" fill="url(#hairGrad)" />

  <!-- Body / Coat & Scarf -->
  <path d="M 100,550 L 120,440 C 140,410 170,390 200,390 C 230,390 260,410 280,440 L 300,550 Z" fill="url(#coatGrad)" />
  <path d="M 155,385 C 180,405 220,405 245,385 C 255,420 250,470 230,480 C 205,490 195,490 170,480 C 150,470 145,420 155,385 Z" fill="#742a2a" />
  <path d="M 185,410 L 175,510 L 210,510 L 215,410 Z" fill="#9b2c2c" opacity="0.9"/>

  <!-- Neck -->
  <path d="M 175,340 L 175,400 C 185,408 215,408 225,400 L 225,340 Z" fill="#f8c7be" />

  <!-- Head / Face -->
  <path d="M 140,210 C 140,310 165,360 200,360 C 235,360 260,310 260,210 C 260,140 235,110 200,110 C 165,110 140,140 140,210 Z" fill="url(#skinGrad)" />

  <!-- Artist Beret with sharp angle -->
  <ellipse cx="192" cy="113" rx="90" ry="40" fill="#2d1b1b" transform="rotate(-5 192 113)"/>
  <circle cx="174" cy="78" r="5" fill="#f87171"/>

  <!-- Front Hair -->
  <path d="M 135,190 C 145,130 170,110 200,110 C 235,110 260,135 265,190 C 255,200 245,215 240,260 C 235,210 220,175 200,180 C 185,175 165,200 160,260 C 155,215 145,200 135,190 Z" fill="url(#hairGrad)" />

  <!-- Anger Face: Sharp furrowed down-slanted eyebrows, sharp focus -->
  <path d="M 160,208 L 190,222" stroke="#3b1e15" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M 240,208 L 210,222" stroke="#3b1e15" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Angry furrow crease -->
  <path d="M 197,216 L 197,225" stroke="#a03030" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 203,216 L 203,225" stroke="#a03030" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Narrowed, stern eyes -->
  <ellipse cx="175" cy="235" rx="10" ry="9" fill="#2d1b1b" />
  <circle cx="173" cy="233" r="2.5" fill="#ffffff" />
  <ellipse cx="225" cy="235" rx="10" ry="9" fill="#2d1b1b" />
  <circle cx="223" cy="233" r="2.5" fill="#ffffff" />

  <!-- Nose -->
  <path d="M 200,255 L 198,262 L 202,263" stroke="#e07567" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Tense, pursed, irritated mouth -->
  <path d="M 190,287 L 210,287" stroke="#742a2a" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Irritated flushed cheeks -->
  <ellipse cx="158" cy="254" rx="11" ry="5" fill="#e53e3e" opacity="0.45" />
  <ellipse cx="242" cy="254" rx="11" ry="5" fill="#e53e3e" opacity="0.45" />

  <!-- State Badge -->
  <rect x="20" y="20" width="115" height="32" rx="16" fill="rgba(0,0,0,0.5)" stroke="#f87171" stroke-width="1.5"/>
  <circle cx="36" cy="36" r="6" fill="#ef4444" />
  <text x="52" y="41" fill="#fee2e2" font-family="sans-serif" font-size="13" font-weight="700">ANGER</text>
</svg>
